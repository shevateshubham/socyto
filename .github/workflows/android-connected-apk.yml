name: SOCYTO Connected Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  connected-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Public client configuration for the SOCYTO production deployment.
    # These are NOT credentials or service-role secrets. App-side RLS is enforced by Supabase.
    # Keep deployment configuration in CI rather than embedding fallbacks in Kotlin source.
    env:
      SOCYTO_SUPABASE_URL: https://ycpwqdukfsmxrfntsfyd.supabase.co
      SOCYTO_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TO8PiJySbPKM9_bqgXhGbQ_B2Vs_SXZ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER" || { echo "Android sdkmanager missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify backend and build connected Android APK
        run: gradle :app:verifyProductionBackend :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: socyto-connected-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
