name: SOCYTO Connected Android APK
on:
  workflow_dispatch:
jobs:
  connected-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require live SOCYTO backend configuration
        env:
          SOCYTO_SUPABASE_URL: ${{ vars.SOCYTO_SUPABASE_URL }}
          SOCYTO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SOCYTO_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test "$SOCYTO_SUPABASE_URL" = "https://ycpwqdukfsmxrfntsfyd.supabase.co" || { echo "Set the real SOCYTO_SUPABASE_URL GitHub Actions variable."; exit 1; }
          case "$SOCYTO_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "Set a public Supabase publishable key, never a secret/service role key."; exit 1 ;;
          esac
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER" || { echo "Android sdkmanager missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and assemble connected Android APK
        env:
          SOCYTO_SUPABASE_URL: ${{ vars.SOCYTO_SUPABASE_URL }}
          SOCYTO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SOCYTO_SUPABASE_PUBLISHABLE_KEY }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: socyto-connected-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
