name: SOCYTO Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [feature/firm-client-code-onboarding]
    paths:
      - 'app/**'
      - '.github/workflows/android-signed-release.yml'

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35 build tools
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Confirm production configuration and signing credentials
        shell: bash
        env:
          SOCYTO_SUPABASE_URL: ${{ vars.SOCYTO_SUPABASE_URL }}
          SOCYTO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SOCYTO_SUPABASE_PUBLISHABLE_KEY }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.SOCYTO_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.SOCYTO_RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.SOCYTO_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SOCYTO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SOCYTO_SUPABASE_URL" || { echo "::error::Production Supabase URL is missing."; exit 1; }
          test -n "$SOCYTO_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Publishable key is missing."; exit 1; }
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::Permanent release signing keystore is missing."; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "::error::Keystore alias is missing."; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "::error::Keystore password is missing."; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "::error::Key password is missing."; exit 1; }
      - name: Compile real release APK and run unit tests
        env:
          SOCYTO_SUPABASE_URL: ${{ vars.SOCYTO_SUPABASE_URL }}
          SOCYTO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SOCYTO_SUPABASE_PUBLISHABLE_KEY }}
        run: gradle :app:verifyProductionBackend :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Align, sign and verify release APK
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.SOCYTO_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.SOCYTO_RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.SOCYTO_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SOCYTO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export KEYSTORE_PATH="$RUNNER_TEMP/socyto-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          mkdir -p signed-apk
          "$TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk signed-apk/SOCYTO-release-aligned.apk
          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out signed-apk/SOCYTO-release.apk \
            signed-apk/SOCYTO-release-aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs signed-apk/SOCYTO-release.apk
          sha256sum signed-apk/SOCYTO-release.apk > signed-apk/SOCYTO-release.apk.sha256
          rm -f signed-apk/SOCYTO-release-aligned.apk "$KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: socyto-signed-release-apk
          path: |
            signed-apk/SOCYTO-release.apk
            signed-apk/SOCYTO-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
